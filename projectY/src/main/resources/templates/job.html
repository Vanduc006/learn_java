<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Hunter</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family: Arial, Helvetica, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8; padding:20px;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
                <tr>
                    <td style="background-color:#2563eb; padding:20px; color:#ffffff;">
                        <h1 style="margin:0; font-size:22px;">
                            Job Hunter
                        </h1>
                        <p style="margin:6px 0 0; font-size:14px;">
                            Hi <span th:text="${component}"></span>, here are jobs matching you 👋
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px;">

                        <div th:each="job : ${jobs}"
                             style="border:1px solid #e5e7eb; border-radius:6px; padding:15px; margin-bottom:16px;">

                            <h2 style="margin:0 0 6px; font-size:18px; color:#111827;"
                                th:text="${job.name}">
                            </h2>

                            <p style="margin:0 0 8px; font-size:14px; color:#374151;">
                                🏢 <strong th:text="${job.company.name}"></strong>
                            </p>

                            <p style="margin:0 0 10px; font-size:13px; color:#6b7280;">
                                📍 <span th:text="${job.location}"></span>
                                &nbsp;|&nbsp;
                                🎓 <span th:text="${job.level}"></span>
                            </p>

                            <div>
                                <span th:each="skill : ${job.skills}"
                                      th:text="${skill.name}"
                                      style="display:inline-block;
                                             background-color:#eef2ff;
                                             color:#3730a3;
                                             font-size:12px;
                                             padding:4px 8px;
                                             border-radius:12px;
                                             margin:0 6px 6px 0;">
                                </span>
                            </div>
                        </div>

                    </td>
                </tr>

                <tr>
                    <td style="background-color:#f9fafb; padding:16px; text-align:center;">
                        <p style="margin:0; font-size:12px; color:#6b7280;">
                            © 2025 Job Hunter • Helping you find better opportunities 🚀
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
